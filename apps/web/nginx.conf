server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反向代理到 api 服务（compose 网络）
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # SSE 支持关闭缓冲
        proxy_buffering off;
    }
}
