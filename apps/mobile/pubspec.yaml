name: adui_forge
description: "ADui Forge Mobile — 随时随地查看、控制、审批正在执行的 Agent"
publish_to: "none"
version: 0.5.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  go_router: ^16.2.4
  dio: ^5.9.0
  flutter_secure_storage: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: assets/icon-1024.png
  android: true
  ios: true
  remove_alpha_ios: true
