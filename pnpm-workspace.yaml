packages:
  - apps/*
  - packages/*
  - tools/*

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  koffi: true
  node-pty: true
  prisma: true
  sharp: true

catalogMode: prefer

catalog:
  "@ai-sdk/openai-compatible": ^3.0.39
  "@ai-sdk/provider": ^4.0.8
  "@modelcontextprotocol/sdk": ^1.30.0
  "@monaco-editor/react": ^4.7.0
  "@nestjs/common": ^12.0.1
  "@nestjs/core": ^12.0.1
  "@nestjs/platform-fastify": ^12.1.2
  "@node-rs/argon2": ^2.1.0
  "@prisma/client": ^7.10.0
  "@resvg/resvg-js": ^2.6.2
  "@rspress/core": ^2.0.21
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/react-query": ^5.102.8
  "fastify": ^5.12.5
  "@tauri-apps/cli": ^2.11.4
  "@types/node": ^24.13.3
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.5
  "@vitejs/plugin-react": ^6.1.1
  "@xyflow/react": ^12.11.6
  ai: ^7.0.83
  ajv: ^8.20.0
  antd: ^6.6.2
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  i18next: ^26.4.2
  lucide-react: ^1.41.0
  monaco-editor: ^0.56.0
  pngjs: ^7.0.0
  prisma: 8.0.0-rc.12
  react: ^19.2.8
  react-dom: ^19.2.8
  react-i18next: ^17.0.13
  react-router: ^8.3.0
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.2
  tailwind-merge: ^3.6.0
  tailwindcss: ^4.3.3
  tsx: ^4.23.12
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vite-plus: 0.2.9
  void: ^0.10.12
  zod: ^4.5.2
  node-pty: ^1.1.0
  "@fastify/websocket": ^11.3.0
  "@xterm/xterm": ^6.0.0
  "@xterm/addon-fit": ^0.11.0
overrides:
  vite: "catalog:"
  # 安全升级（pnpm audit）：传递依赖的补丁版超出父包声明范围，显式钉住
  # dompurify（经 monaco-editor，GHSA-c2j3-45gr-mqc4 等 3 项 XSS 修补 ≥3.4.13）
  dompurify: ^3.4.16
  # deepmerge-ts（经 @prisma/config，GHSA-ggr8-5vv4-36mx 原型污染 ≥8.0.0）
  deepmerge-ts: ^8.0.2
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  - zod@4.5.2
  - "@koromix/koffi-android-arm64@3.3.2"
  - "@koromix/koffi-android-x64@3.3.2"
  - "@koromix/koffi-darwin-arm64@3.3.2"
  - "@koromix/koffi-darwin-x64@3.3.2"
  - "@koromix/koffi-freebsd-arm64@3.3.2"
  - "@koromix/koffi-freebsd-ia32@3.3.2"
  - "@koromix/koffi-freebsd-x64@3.3.2"
  - "@koromix/koffi-linux-arm64@3.3.2"
  - "@koromix/koffi-linux-arm@3.3.2"
  - "@koromix/koffi-linux-ia32@3.3.2"
  - "@koromix/koffi-linux-loong64@3.3.2"
  - "@koromix/koffi-linux-ppc64@3.3.2"
  - "@koromix/koffi-linux-riscv64@3.3.2"
  - "@koromix/koffi-linux-x64@3.3.2"
  - "@koromix/koffi-openbsd-arm64@3.3.2"
  - "@koromix/koffi-openbsd-ia32@3.3.2"
  - "@koromix/koffi-openbsd-x64@3.3.2"
  - "@koromix/koffi-win32-arm64@3.3.2"
  - "@koromix/koffi-win32-ia32@3.3.2"
  - "@koromix/koffi-win32-x64@3.3.2"
  - koffi@3.3.2
onlyBuiltDependencies:
  - node-pty
