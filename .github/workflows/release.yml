name: Release

on:
  push:
    tags: ["v*"]

# 创建 Release 需要写权限（最小授权原则下仅此必要项）
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    name: Desktop 安装包（Windows）
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 安装 pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: 安装 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Rust 工具链
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 Web 资源（Tauri frontendDist）
        run: pnpm --filter @adui-forge/desktop-ui build

      - name: 安装 Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: 构建 Runner sidecar（Bun compile，ADR-007）
        run: node scripts/build-runner.mjs windows-x64

      - name: 打包 Desktop 安装程序
        run: pnpm --filter @adui-forge/desktop bundle

      # 统一命名：adui-forge-<version>-windows-x64-setup.exe / adui-forge-<version>-windows-x64.msi
      - name: 重命名产物
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $nsis = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $msi = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          Rename-Item $nsis.FullName "adui-forge-$version-windows-x64-setup.exe"
          Rename-Item $msi.FullName "adui-forge-$version-windows-x64.msi"

      - name: 生成发布说明
        run: node scripts/release-notes.mjs > release-notes.md

      - name: 上传安装包到 Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/adui-forge-*-windows-x64-setup.exe
            apps/desktop/src-tauri/target/release/bundle/msi/adui-forge-*-windows-x64.msi

  desktop-mac:
    name: Desktop 安装包（macOS DMG）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple Silicon
            runner_target: darwin-arm64
            runner_file: forge-runner-aarch64-apple-darwin
            dmg_suffix: macos-arm64
          - os: macos-15-intel # Intel
            runner_target: darwin-x64
            runner_file: forge-runner-x86_64-apple-darwin
            dmg_suffix: macos-x64
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 安装 pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: 安装 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Rust 工具链
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 Web 资源（Tauri frontendDist）
        run: pnpm --filter @adui-forge/desktop-ui build

      - name: 安装 Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: 构建 Runner sidecar（Bun compile）
        run: node scripts/build-runner.mjs ${{ matrix.runner_target }}

      - name: 打包 DMG
        run: pnpm --filter @adui-forge/desktop bundle

      # 统一命名：adui-forge-<version>-<dmg_suffix>.dmg
      - name: 重命名产物
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          mv apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg \
             "apps/desktop/src-tauri/target/release/bundle/dmg/adui-forge-${version}-${{ matrix.dmg_suffix }}.dmg"

      - name: 生成发布说明
        run: node scripts/release-notes.mjs > release-notes.md

      - name: 上传 DMG 到 Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            apps/desktop/src-tauri/target/release/bundle/dmg/adui-forge-*-macos-*.dmg

  desktop-linux:
    name: Desktop 包（Linux AppImage/deb）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 安装 pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: 安装 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Tauri Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Rust 工具链
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 Web 资源（Tauri frontendDist）
        run: pnpm --filter @adui-forge/desktop-ui build

      - name: 安装 Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: 构建 Runner sidecar（Linux x64）
        run: node scripts/build-runner.mjs linux-x64

      - name: 打包 AppImage / deb
        run: pnpm --filter @adui-forge/desktop bundle

      # 统一命名：adui-forge-<version>-linux-x64.AppImage / adui-forge-<version>-linux-x64.deb
      - name: 重命名产物
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          mv apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage \
             "apps/desktop/src-tauri/target/release/bundle/appimage/adui-forge-${version}-linux-x64.AppImage"
          mv apps/desktop/src-tauri/target/release/bundle/deb/*.deb \
             "apps/desktop/src-tauri/target/release/bundle/deb/adui-forge-${version}-linux-x64.deb"

      - name: 生成发布说明
        run: node scripts/release-notes.mjs > release-notes.md

      - name: 上传到 Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            apps/desktop/src-tauri/target/release/bundle/appimage/adui-forge-*-linux-x64.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/adui-forge-*-linux-x64.deb

  mobile:
    name: Mobile APK（Android）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 安装 Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      # flutter-action(Rust 实现)在 CI 上 panic(exit 101)，且 @main 为可变引用；改用 git 克隆 stable
      - name: 克隆 Flutter 3.41.7（仓库大，失败重试 3 次）
        run: |
          for attempt in 1 2 3; do
            if git clone --depth 1 -b 3.41.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter-sdk"; then
              break
            fi
            rm -rf "$RUNNER_TEMP/flutter-sdk"
            if [ "$attempt" = "3" ]; then exit 1; fi
            sleep 15
          done
          echo "$RUNNER_TEMP/flutter-sdk/bin" >> "$GITHUB_PATH"

      - name: Flutter bootstrap
        run: flutter --version

      - name: 构建 APK
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter build apk --release

      # 命名规范：adui-forge-<version>.apk（版本号来自 pubspec.yaml，去掉 +build 号）
      - name: 重命名 APK
        run: |
          VERSION=$(grep '^version:' apps/mobile/pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          mv apps/mobile/build/app/outputs/flutter-apk/app-release.apk \
             "apps/mobile/build/app/outputs/flutter-apk/adui-forge-${VERSION}-android.apk"

      - name: 生成发布说明
        run: node scripts/release-notes.mjs > release-notes.md

      - name: 上传 APK 到 Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: release-notes.md
          generate_release_notes: true
          files: apps/mobile/build/app/outputs/flutter-apk/adui-forge-*-android.apk
