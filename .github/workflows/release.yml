name: Release

on:
  push:
    tags: ["v*"]

# 创建 Release 需要写权限（最小授权原则下仅此必要项）
permissions:
  contents: write

jobs:
  desktop:
    name: Desktop 安装包（Windows）
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 安装 pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: 安装 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Rust 工具链
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 Web 资源（Tauri frontendDist）
        run: pnpm --filter @adui-forge/web build

      - name: 打包 Desktop 安装程序
        run: pnpm --filter @adui-forge/desktop bundle

      - name: 上传安装包到 Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi

  mobile:
    name: Mobile APK（Android）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 安装 Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装 Flutter
        uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c # main

      - name: 构建 APK
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter build apk --release

      - name: 上传 APK 到 Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
