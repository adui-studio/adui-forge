name: CI

on:
  push:
    branches: [main]
  pull_request:

# 最小授权（github-actions-hardening）
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 安装 pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: 安装 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # check + test + build 全量验收。
      # Docker / PostgreSQL 依赖的测试在本环境自动跳过（skipIf），不阻塞 CI。
      - name: 全量验收（check / test / build）
        run: pnpm run ready

  desktop-mobile:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 安装 pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: 安装 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖（desktop cli）
        run: pnpm install --frozen-lockfile

      - name: Rust 工具链
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Rust 缓存
        uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Desktop cargo check
        run: cargo check
        working-directory: apps/desktop/src-tauri

      # flutter-action(Rust 实现)在 CI 上 panic(exit 101),改用 git 克隆 stable
      - name: 克隆 Flutter 3.41.7
        run: |
          git clone --depth 1 -b 3.41.7 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter-sdk"
          echo "$RUNNER_TEMP/flutter-sdk/bin" >> "$GITHUB_PATH"

      - name: Flutter bootstrap
        run: flutter --version

      - name: Mobile pub get
        working-directory: apps/mobile
        run: flutter pub get

      - name: Mobile analyze
        working-directory: apps/mobile
        run: flutter analyze

      - name: Mobile test
        working-directory: apps/mobile
        run: flutter test
